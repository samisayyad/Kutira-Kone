kind = "mobile"
previewPath = "/"
title = "Kutira-Kone"
version = "1.0.0"
id = "artifacts/kutira-kone"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20514

[services.development]
run = "pnpm --filter @workspace/kutira-kone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kutira-kone", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kutira-kone", "run", "serve" ]

[services.env]
PORT = "20514"
BASE_PATH = "/"
